<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <!-- Gold gradients -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Saffron Wave -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <!-- Emerald Wave -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <!-- Deep Royal Blue 3D -->
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Top Diamond 'ki Spices' Logo -->
  <g transform="translate(250, 100)" filter="url(#logoShadow)">
    <rect x="-70" y="-70" width="140" height="140" rx="16" transform="rotate(45)" fill="#FFFFFF" stroke="url(#goldBorder)" stroke-width="6" />
    <!-- 'ki' Text -->
    <text x="-10" y="12" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="56" font-weight="900" fill="#111827" text-anchor="middle">k</text>
    <g transform="translate(18, -12)">
      <circle cx="0" cy="-10" r="7.5" fill="#111827" />
      <rect x="-4.5" y="0" width="9" height="28" rx="4.5" fill="#111827" />
    </g>
    <!-- 'Spices' Text -->
    <text x="0" y="40" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#1F2937" text-anchor="middle">Spices</text>
    <!-- Golden Accent Wave Under Spices -->
    <path d="M -32 48 Q 0 56 32 48 Q 5 52 -32 48" fill="url(#goldText)" />
  </g>

  <!-- Saffron Upper Ribbon Band -->
  <g transform="translate(40, 220)">
    <path d="M 0 35 Q 210 -15 420 20 L 420 52 Q 210 12 0 57 Z" fill="url(#saffronGrad)" filter="url(#logoShadow)" />
    <path d="M 0 45 Q 210 5 420 30 L 420 42 Q 210 15 0 52 Z" fill="#FEF08A" opacity="0.6" />
  </g>

  <!-- Main 'indimā' Hindi-English Fusion Brand Typography -->
  <g transform="translate(250, 335)" filter="url(#logoShadow)" text-anchor="middle">
    <!-- Top Devanagari Shirorekha Bar in Gold & Blue -->
    <rect x="-175" y="-42" width="350" height="11" rx="5" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="1.5" />
    
    <!-- Shirorekha accents -->
    <path d="M -152 -42 L -137 -66 L -122 -42 Z" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <path d="M 12 -42 L 27 -66 L 42 -42 Z" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <circle cx="132" cy="-62" r="6.5" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="1.5" />
    <path d="M 112 -52 Q 132 -36 152 -52 Q 132 -44 112 -52" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="1.5" />

    <!-- 'indimā' Stylized Bold Letters -->
    <text x="0" y="26" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="84" font-weight="900" fill="url(#royalBlue)" stroke="url(#goldBorder)" stroke-width="2.5" letter-spacing="2">indimā</text>
  </g>

  <!-- Subtitle Tagline: Pure as mother's love -->
  <g transform="translate(250, 396)" text-anchor="middle">
    <line x1="-190" y1="0" x2="-130" y2="0" stroke="url(#goldText)" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Brush Script MT', 'Lucida Calligraphy', cursive, Georgia, serif" font-size="30" font-style="italic" font-weight="bold" fill="#1E3A8A">Pure as mother's love</text>
    <line x1="130" y1="0" x2="190" y2="0" stroke="url(#goldText)" stroke-width="2.5" />
  </g>

  <!-- Emerald Green Lower Ribbon Band -->
  <g transform="translate(40, 425)">
    <path d="M 0 20 Q 210 65 420 25 L 420 57 Q 210 97 0 47 Z" fill="url(#emeraldGrad)" filter="url(#logoShadow)" />
    <path d="M 0 30 Q 210 75 420 35 L 420 44 Q 210 82 0 40 Z" fill="#A7F3D0" opacity="0.6" />
  </g>
</svg>
